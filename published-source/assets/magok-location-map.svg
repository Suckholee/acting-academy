<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">마곡역에서 로뎀타워까지 위치 안내 약도</title><desc id="desc">5호선 마곡역 5번 출구 인근 로뎀타워 3층. 위치 관계를 단순화한 약도입니다.</desc><rect width="960" height="640" rx="28" fill="#f2f0ea"/><g fill="#e3e0d8"><rect x="55" y="70" width="220" height="140" rx="18"/><rect x="650" y="70" width="250" height="140" rx="18"/><rect x="60" y="400" width="210" height="165" rx="18"/><rect x="665" y="420" width="230" height="145" rx="18"/></g><path d="M0 270H960" stroke="#fff" stroke-width="100"/><path d="M430 0V640" stroke="#fff" stroke-width="100"/><path d="M0 270H960" stroke="#c9c4b8" stroke-width="2" stroke-dasharray="14 12"/><g font-family="Arial,Apple SD Gothic Neo,sans-serif" text-anchor="middle"><text x="775" y="284" fill="#686257" font-size="26">공항대로</text><rect x="295" y="225" width="215" height="68" rx="34" fill="#8545ad"/><text x="402" y="268" fill="white" font-size="27" font-weight="700">⑤ 마곡역</text><circle cx="465" cy="355" r="25" fill="#8545ad"/><text x="465" y="364" fill="white" font-size="25" font-weight="700">5</text><text x="405" y="403" fill="#4d4357" font-size="21">5번 출구</text><path d="M500 355H585" stroke="#9a751e" stroke-width="7" stroke-dasharray="10 8"/><path d="M580 344L595 355L580 366" fill="none" stroke="#9a751e" stroke-width="5"/><rect x="610" y="320" width="280" height="96" rx="18" fill="#202126"/><text x="750" y="358" fill="#f4d481" font-size="26" font-weight="700">로뎀타워 3층</text><text x="750" y="390" fill="white" font-size="22">김정태 배우아카데미</text><text x="480" y="530" fill="#36332d" font-size="25" font-weight="700">서울 강서구 공항대로 186</text><text x="480" y="578" fill="#69645b" font-size="19">위치 관계를 단순화한 참고용 약도 · 정확한 경로는 지도에서 확인</text></g></svg>